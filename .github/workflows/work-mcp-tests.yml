name: Work MCP ingestion tests
on:
  push:
    branches: [work-mcp-ingestion]
  pull_request:
    paths:
      - app/Http/Controllers/Api/WorkMcpController.php
      - routes/api.php
      - tests/Feature/WorkMcpTest.php
      - .github/workflows/work-mcp-tests.yml
permissions:
  contents: read
jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test --filter='WorkMcpTest|RequirementIngestionTest'
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
